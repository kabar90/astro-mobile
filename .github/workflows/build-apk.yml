
name: Build ASTRO MOBILE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ASTRO_MOBILE_FIXED_SOURCE.zip'
      - 'google-services.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf astro_mobile ASTRO_MOBILE_FIXED_SOURCE
          unzip -o ASTRO_MOBILE_FIXED_SOURCE.zip
          test -d ASTRO_MOBILE_FIXED_SOURCE/astro_mobile_redesign
          mv ASTRO_MOBILE_FIXED_SOURCE/astro_mobile_redesign astro_mobile

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: astro_mobile
        run: flutter create --platforms=android .

      - name: Configure Firebase and notification desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android = Path("astro_mobile/android")
          settings = android / "settings.gradle.kts"
          app_gradle = android / "app" / "build.gradle.kts"

          if settings.exists() and app_gradle.exists():
              s = settings.read_text()
              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                      1
                  )
                  settings.write_text(s)

              a = app_gradle.read_text()
              if 'id("com.google.gms.google-services")' not in a:
                  a = a.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services")',
                      1
                  )

              if "isCoreLibraryDesugaringEnabled = true" not in a:
                  a = a.replace(
                      "compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                      1
                  )

              if "coreLibraryDesugaring(" not in a:
                  a = a.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      1
                  )

              app_gradle.write_text(a)

          else:
              settings = android / "settings.gradle"
              app_gradle = android / "app" / "build.gradle"

              if not settings.exists() or not app_gradle.exists():
                  raise SystemExit("Could not locate Android Gradle files")

              s = settings.read_text()
              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services' version '4.4.2' apply false",
                      1
                  )
                  settings.write_text(s)

              a = app_gradle.read_text()
              if "com.google.gms.google-services" not in a:
                  a = a.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1
                  )

              if "coreLibraryDesugaringEnabled true" not in a:
                  a = a.replace(
                      "compileOptions {",
                      "compileOptions {\n        coreLibraryDesugaringEnabled true",
                      1
                  )

              if "coreLibraryDesugaring " not in a:
                  a = a.replace(
                      "dependencies {",
                      "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                      1
                  )

              app_gradle.write_text(a)
          PY

      - name: Disable crashing Android release lint tasks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android = Path("astro_mobile/android")

          snippet = """
          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          """

          candidates = [
              android / "build.gradle.kts",
              android / "build.gradle"
          ]

          root_gradle = next(
              (p for p in candidates if p.exists()),
              None
          )

          if root_gradle is None:
              raise SystemExit("Android root Gradle file not found")

          content = root_gradle.read_text()

          if 'name.startsWith("lintVital")' not in content:
              root_gradle.write_text(content.rstrip() + "\n" + snippet)

          PY

      - name: Add Firebase config
        run: |
          test -f google-services.json
          mkdir -p astro_mobile/android/app
          cp google-services.json astro_mobile/android/app/google-services.json

      - name: Get dependencies
        working-directory: astro_mobile
        run: flutter pub get

      - name: Clean project
        working-directory: astro_mobile
        run: flutter clean

      - name: Get dependencies again
        working-directory: astro_mobile
        run: flutter pub get

      - name: Build APK
        working-directory: astro_mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-MOBILE-FIXED
          path: astro_mobile/build/app/outputs/flutter-apk/app-release.apk
