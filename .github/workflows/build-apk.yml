
name: Build ASTRO MOBILE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ASTRO_MOBILE_POINTS_PAYMENT_UI.zip'
      - '.github/workflows/build-apk.yml'
      - 'google-services.json'
      - '.github/workflows/build-apk.yml'
      - 'patches/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          rm -rf astro_mobile extracted_project
          mkdir -p extracted_project
          unzip -o ASTRO_MOBILE_POINTS_PAYMENT_UI.zip -d extracted_project

          PROJECT_DIR="$(find extracted_project -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find pubspec.yaml in the extracted archive."
            find extracted_project -maxdepth 4 -type f | sort | head -100
            exit 1
          fi

          mv "$PROJECT_DIR" astro_mobile
          rm -rf extracted_project
          test -f astro_mobile/pubspec.yaml
          echo "Flutter project found and extracted successfully."

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-astro-mobile-v1
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: astro_mobile
        run: flutter create --platforms=android .


      - name: Ensure Gradle plugin repositories
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          android = Path("astro_mobile/android")
          candidates = [android / "settings.gradle.kts", android / "settings.gradle"]
          settings = next((p for p in candidates if p.exists()), None)
          if settings is None:
              raise SystemExit("Gradle settings file not found")

          source = settings.read_text()
          match = re.search(r'(?m)^\s*pluginManagement\s*\{', source)
          if not match:
              raise SystemExit("pluginManagement block not found")
          start = source.find("{", match.start())
          depth = 0
          end = None
          for i in range(start, len(source)):
              if source[i] == "{":
                  depth += 1
              elif source[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break
          if end is None:
              raise SystemExit("Unclosed pluginManagement block")

          block = source[start:end + 1]
          repos = re.search(r'(?m)^\s*repositories\s*\{', block)
          required = ["google()", "gradlePluginPortal()", "mavenCentral()"]
          if repos:
              rstart = block.find("{", repos.start())
              rdepth = 0
              rend = None
              for i in range(rstart, len(block)):
                  if block[i] == "{":
                      rdepth += 1
                  elif block[i] == "}":
                      rdepth -= 1
                      if rdepth == 0:
                          rend = i
                          break
              if rend is None:
                  raise SystemExit("Unclosed repositories block")
              existing = block[rstart + 1:rend]
              missing = [item for item in required if item not in existing]
              if missing:
                  block = block[:rend] + "\n" + "\n".join("        " + item for item in missing) + "\n    " + block[rend:]
          else:
              block = block[:1] + "\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n" + block[1:]

          settings.write_text(source[:start] + block + source[end + 1:])
          print("Configured Gradle plugin repositories: Google, Maven Central, Gradle Plugin Portal")
          PYCODE

      - name: Configure Supabase email deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("astro_mobile/android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          scheme = "com.astromobile.store"
          host = "login-callback"
          if f'android:scheme="{scheme}"' not in content:
              intent_filter = f'''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="{scheme}" android:host="{host}" />
                  </intent-filter>
              '''
              if "</activity>" not in content:
                  raise SystemExit("MainActivity closing tag not found in AndroidManifest.xml")
              content = content.replace("</activity>", intent_filter + "\n        </activity>", 1)
              manifest.write_text(content)
          print(f"Configured Android auth callback: {scheme}://{host}")
          PY

      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          android = Path("astro_mobile/android")
          settings = android / "settings.gradle.kts"
          app = android / "app" / "build.gradle.kts"
          if not settings.exists():
              settings = android / "settings.gradle"
          if not app.exists():
              app = android / "app" / "build.gradle"
          if not settings.exists() or not app.exists():
              raise SystemExit("Android Gradle files not found")
          kotlin = app.suffix == ".kts"
          s = settings.read_text()
          a = app.read_text()
          if "com.google.gms.google-services" not in s:
              plugin = (
                  '    id("com.google.gms.google-services") version "4.4.2" apply false'
                  if settings.suffix == ".kts"
                  else "    id 'com.google.gms.google-services' version '4.4.2' apply false"
              )
              s = re.sub(r'plugins\s*\{', lambda m: m.group(0) + "\n" + plugin, s, count=1)
              settings.write_text(s)
          if "com.google.gms.google-services" not in a:
              plugin = '    id("com.google.gms.google-services")' if kotlin else "    id 'com.google.gms.google-services'"
              a = re.sub(r'plugins\s*\{', lambda m: m.group(0) + "\n" + plugin, a, count=1)
          if kotlin:
              if "isCoreLibraryDesugaringEnabled" not in a:
                  a = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', a, count=1)
              a = re.sub(r'(?m)^\s*coreLibraryDesugaring\(.*\)\s*$', '', a)
              dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              a = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', a)
          else:
              if "coreLibraryDesugaringEnabled true" not in a:
                  a = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        coreLibraryDesugaringEnabled true', a, count=1)
              a = re.sub(r'(?m)^\s*coreLibraryDesugaring\s+.*$', '', a)
              dependency = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              a = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', a)
          if "compileOptions {" not in a:
              raise SystemExit("compileOptions block not found")
          if re.search(r'(?m)^\s*dependencies\s*\{', a):
              a = re.sub(r'(?m)^(\s*dependencies\s*\{)', lambda m: m.group(1) + "\n" + dependency, a, count=1)
          else:
              a += "\n\ndependencies {\n" + dependency + "\n}\n"
          app.write_text(a)
          if "desugar_jdk_libs:2.1.4" not in a:
              raise SystemExit("Desugaring dependency missing")
          if "com.google.gms.google-services" not in app.read_text():
              raise SystemExit("Firebase Gradle plugin missing")
          print("Android Gradle configuration completed successfully.")
          PY

      - name: Disable crashing Android release lint tasks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          android = Path("astro_mobile/android")
          candidates = [android / "build.gradle.kts", android / "build.gradle"]
          root = next((p for p in candidates if p.exists()), None)
          if root is None:
              raise SystemExit("Android root Gradle file not found")
          content = root.read_text()
          snippet = '''
          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          '''
          if 'name.startsWith("lintVital")' not in content:
              root.write_text(content.rstrip() + "\n" + snippet)
          print("Release lint configuration completed.")
          PY

      - name: Add Firebase config
        run: |
          test -f google-services.json
          mkdir -p astro_mobile/android/app
          cp google-services.json astro_mobile/android/app/google-services.json

      - name: Get dependencies
        working-directory: astro_mobile
        run: flutter pub get

      - name: Clean project
        working-directory: astro_mobile
        run: flutter clean

      - name: Get dependencies again
        working-directory: astro_mobile
        run: flutter pub get

      - name: Generate ASTRO MOBILE launcher icon
        working-directory: astro_mobile
        run: dart run flutter_launcher_icons

      - name: Build APK (retry transient repository rate limits)
        working-directory: astro_mobile
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "APK build attempt ${attempt}/3"
            if flutter build apk --release; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              wait_seconds=$((attempt * 30))
              echo "Build failed; waiting ${wait_seconds}s before retry (helps with Maven HTTP 429 rate limits)."
              sleep "${wait_seconds}"
            fi
          done
          echo "APK build failed after 3 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-MOBILE-BLUE-BRAND
          path: astro_mobile/build/app/outputs/flutter-apk/app-release.apk
