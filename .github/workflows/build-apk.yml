
name: Build ASTRO MOBILE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ASTRO_MOBILE_FIXED_SOURCE.zip'
      - 'google-services.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf astro_mobile
          unzip -o ASTRO_MOBILE_FIXED_SOURCE.zip
          test -d astro_mobile_redesign
          mv astro_mobile_redesign astro_mobile

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: astro_mobile
        run: flutter create --platforms=android .

      - name: Configure Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android = Path("astro_mobile/android")
          settings = android / "settings.gradle.kts"
          app = android / "app" / "build.gradle.kts"

          if settings.exists() and app.exists():
              s = settings.read_text()
              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                      1
                  )
                  settings.write_text(s)

              a = app.read_text()
              if 'id("com.google.gms.google-services")' not in a:
                  a = a.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services")',
                      1
                  )
                  app.write_text(a)
          else:
              settings = android / "settings.gradle"
              app = android / "app" / "build.gradle"

              if not settings.exists() or not app.exists():
                  raise SystemExit("Android Gradle files not found")

              s = settings.read_text()
              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services' version '4.4.2' apply false",
                      1
                  )
                  settings.write_text(s)

              a = app.read_text()
              if "com.google.gms.google-services" not in a:
                  a = a.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1
                  )
                  app.write_text(a)
          PY

      - name: Add Firebase config
        run: |
          test -f google-services.json
          mkdir -p astro_mobile/android/app
          cp google-services.json astro_mobile/android/app/google-services.json

      - name: Get dependencies
        working-directory: astro_mobile
        run: flutter pub get

      - name: Build APK
        working-directory: astro_mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-MOBILE-FIXED
          path: astro_mobile/build/app/outputs/flutter-apk/app-release.apk
