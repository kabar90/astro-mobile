
name: Build ASTRO MOBILE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'astro_mobile_redesign_v1_1_compile_fixed.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract new design
        run: |
          rm -rf astro_mobile
          unzip -o astro_mobile_redesign_v1_1_compile_fixed.zip
          mv astro_mobile_redesign astro_mobile

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: astro_mobile
        run: flutter create --platforms=android .

      - name: Get dependencies
        working-directory: astro_mobile
        run: flutter pub get

      - name: Build APK
        working-directory: astro_mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-MOBILE-NEW-DESIGN
          path: astro_mobile/build/app/outputs/flutter-apk/app-release.apk
