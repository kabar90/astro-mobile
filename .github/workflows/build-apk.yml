
name: Build ASTRO MOBILE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ASTRO_MOBILE_FIXED_SOURCE.zip'
      - 'google-services.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf astro_mobile
          unzip -o ASTRO_MOBILE_FIXED_SOURCE.zip

          if [ -d ASTRO_MOBILE_FIXED_SOURCE/astro_mobile_redesign ]; then
            mv ASTRO_MOBILE_FIXED_SOURCE/astro_mobile_redesign astro_mobile
          elif [ -d astro_mobile_redesign ]; then
            mv astro_mobile_redesign astro_mobile
          else
            echo "Project folder not found"
            find . -maxdepth 4 -name pubspec.yaml
            exit 1
          fi

          test -f astro_mobile/pubspec.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: astro_mobile
        run: flutter create --platforms=android .

      - name: Configure Android and desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android = Path("astro_mobile/android")

          settings = android / "settings.gradle.kts"
          app = android / "app" / "build.gradle.kts"

          if not settings.exists() or not app.exists():
              settings = android / "settings.gradle"
              app = android / "app" / "build.gradle"

          if not settings.exists() or not app.exists():
              raise SystemExit("Android Gradle files not found")

          s = settings.read_text()

          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  1
              )
              settings.write_text(s)

          a = app.read_text()

          if app.name.endswith(".kts"):
              google_plugin = 'id("com.google.gms.google-services")'
              desugar_flag = "isCoreLibraryDesugaringEnabled = true"
              desugar_dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              google_plugin = "id 'com.google.gms.google-services'"
              desugar_flag = "coreLibraryDesugaringEnabled true"
              desugar_dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if "google-services" not in a:
              a = a.replace("plugins {", "plugins {\n    " + google_plugin, 1)

          if "compileOptions {" not in a:
              raise SystemExit("compileOptions block not found")

          if "isCoreLibraryDesugaringEnabled = true" not in a and "coreLibraryDesugaringEnabled true" not in a:
              a = a.replace(
                  "compileOptions {",
                  "compileOptions {\n        " + desugar_flag,
                  1
              )

          if "dependencies {" in a:
              if "desugar_jdk_libs" not in a:
                  a = a.replace(
                      "dependencies {",
                      "dependencies {\n    " + desugar_dependency,
                      1
                  )
          else:
              a += "\n\ndependencies {\n    " + desugar_dependency + "\n}\n"

          app.write_text(a)
          print("Desugaring configured successfully")
          PY

      - name: Disable failing Firebase lint task
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android = Path("astro_mobile/android")
          gradle_kts = android / "build.gradle.kts"
          gradle_groovy = android / "build.gradle"

          block = """
          allprojects {
              tasks.configureEach {
                  if (path == ":firebase_core:lintVitalAnalyzeRelease") {
                      enabled = false
                  }
              }
          }
          """

          if gradle_kts.exists():
              p = gradle_kts
          elif gradle_groovy.exists():
              p = gradle_groovy
          else:
              raise SystemExit("Root Android build.gradle not found")

          content = p.read_text()

          if "firebase_core:lintVitalAnalyzeRelease" not in content:
              p.write_text(content + "\n" + block)

          print("Firebase lint task disabled")
          PY

      - name: Add Firebase config
        run: |
          test -f google-services.json
          mkdir -p astro_mobile/android/app
          cp google-services.json astro_mobile/android/app/google-services.json

      - name: Get dependencies
        working-directory: astro_mobile
        run: flutter pub get

      - name: Build APK
        working-directory: astro_mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-MOBILE-FIXED
          path: astro_mobile/build/app/outputs/flutter-apk/app-release.apk
          
