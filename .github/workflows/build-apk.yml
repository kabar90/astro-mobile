
name: Build ASTRO MOBILE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ASTRO_MOBILE_FIXED_SOURCE.zip'
      - 'google-services.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf astro_mobile
          unzip -o ASTRO_MOBILE_FIXED_SOURCE.zip

          if [ -d ASTRO_MOBILE_FIXED_SOURCE/astro_mobile_redesign ]; then
            mv ASTRO_MOBILE_FIXED_SOURCE/astro_mobile_redesign astro_mobile
          elif [ -d astro_mobile_redesign ]; then
            mv astro_mobile_redesign astro_mobile
          else
            echo "Project folder not found"
            find . -maxdepth 4 -name pubspec.yaml
            exit 1
          fi

          test -f astro_mobile/pubspec.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: astro_mobile
        run: flutter create --platforms=android .

      - name: Configure Android Firebase and notification desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android = Path("astro_mobile/android")
          settings_kts = android / "settings.gradle.kts"
          app_kts = android / "app" / "build.gradle.kts"

          settings_groovy = android / "settings.gradle"
          app_groovy = android / "app" / "build.gradle"

          if settings_kts.exists() and app_kts.exists():
              s = settings_kts.read_text()

              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                      1
                  )
                  settings_kts.write_text(s)

              a = app_kts.read_text()

              if 'id("com.google.gms.google-services")' not in a:
                  a = a.replace(
                      "plugins {",
                      'plugins {\n    id("com.google.gms.google-services")',
                      1
                  )

              if "isCoreLibraryDesugaringEnabled = true" not in a:
                  a = a.replace(
                      "compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                      1
                  )

              if "coreLibraryDesugaring(" not in a:
                  a = a.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      1
                  )

              app_kts.write_text(a)

          elif settings_groovy.exists() and app_groovy.exists():
              s = settings_groovy.read_text()

              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services' version '4.4.2' apply false",
                      1
                  )
                  settings_groovy.write_text(s)

              a = app_groovy.read_text()

              if "com.google.gms.google-services" not in a:
                  a = a.replace(
                      "plugins {",
                      "plugins {\n    id 'com.google.gms.google-services'",
                      1
                  )

              if "coreLibraryDesugaringEnabled true" not in a:
                  a = a.replace(
                      "compileOptions {",
                      "compileOptions {\n        coreLibraryDesugaringEnabled true",
                      1
                  )

              if "coreLibraryDesugaring " not in a:
                  a = a.replace(
                      "dependencies {",
                      "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                      1
                  )

              app_groovy.write_text(a)

          else:
              raise SystemExit("Android Gradle files not found")
          PY

      - name: Add Firebase config
        run: |
          test -f google-services.json
          mkdir -p astro_mobile/android/app
          cp google-services.json astro_mobile/android/app/google-services.json

      - name: Get dependencies
        working-directory: astro_mobile
        run: flutter pub get

      - name: Build APK
        working-directory: astro_mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-MOBILE-FIXED
          path: astro_mobile/build/app/outputs/flutter-apk/app-release.apk
          
