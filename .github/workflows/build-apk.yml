
name: Build ASTRO MOBILE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ASTRO_MOBILE_POINTS_PAYMENT_UI.zip'
      - '.github/workflows/build-apk.yml'
      - 'google-services.json'
      - '.github/workflows/build-apk.yml'
      - 'patches/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          rm -rf astro_mobile extracted_project
          mkdir -p extracted_project
          unzip -o ASTRO_MOBILE_POINTS_PAYMENT_UI.zip -d extracted_project

          PROJECT_DIR="$(find extracted_project -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find pubspec.yaml in the extracted archive."
            find extracted_project -maxdepth 4 -type f | sort | head -100
            exit 1
          fi

          mv "$PROJECT_DIR" astro_mobile
          rm -rf extracted_project
          test -f astro_mobile/pubspec.yaml
          echo "Flutter project found and extracted successfully."

      - name: Fix duplicate image downloads and enable persistent cache
        run: |
          set -e
          python3 scripts/patch_image_cache.py
          grep -q "CachedNetworkImage(" astro_mobile/lib/widgets/astro_cached_image.dart
          grep -q "maxNrOfCacheObjects: 500" astro_mobile/lib/widgets/astro_cached_image.dart
          echo "Single-request persistent image cache patch applied."

      - name: Keep the last product and category catalogue available offline
        run: |
          set -e
          python3 scripts/patch_offline_catalog_cache.py
          grep -q "Do not start realtime after a failed REST request" astro_mobile/lib/services/product_repository.dart
          grep -q "static Stream<List<StoreCategory>> watchCategories()" astro_mobile/lib/services/product_repository.dart
          echo "Offline-first product and category catalogue patch applied."

      - name: Reduce catalogue REST response payload
        run: |
          set -e
          python3 scripts/patch_catalog_select_columns.py
          grep -q "select('id,name,price,category,stock,description,image_url,is_active,colors,subcategory_id,reward_points,allow_points_payment')" astro_mobile/lib/services/product_repository.dart
          grep -q "select('id,name,parent_id,sort_order,is_active,image_url')" astro_mobile/lib/services/product_repository.dart
          echo "Catalogue queries limited to required columns."

      - name: Load product descriptions only on demand
        run: |
          set -e
          python3 scripts/patch_product_detail_lazy_load.py
          grep -q "select('id,name,price,category,stock,image_url,is_active,colors,subcategory_id,reward_points,allow_points_payment')" astro_mobile/lib/services/product_repository.dart
          grep -q "getProductDescription" astro_mobile/lib/services/product_repository.dart
          grep -q "_loadProductDescription" astro_mobile/lib/screens/product_detail_screen.dart
          echo "Lazy product description loading and offline detail cache applied."

      - name: Avoid duplicate initial catalogue realtime snapshots
        run: |
          set -e
          python3 scripts/patch_realtime_catalogue_refresh.py
          grep -q "astro-products-catalogue" astro_mobile/lib/services/product_repository.dart
          grep -q "astro-categories-catalogue" astro_mobile/lib/services/product_repository.dart
          grep -q "onPostgresChanges" astro_mobile/lib/services/product_repository.dart
          echo "Realtime now refreshes only after actual table changes."

      - name: Show priced inquiry images inside the matching category
        run: |
          set -e
          python3 scripts/patch_product_inquiry_inline_images.py
          grep -q "الخيارات المتوفرة بالصور والأسعار" astro_mobile/lib/screens/product_inquiry_inline.dart
          grep -q "admin_image_items" astro_mobile/supabase/product_inquiries.sql
          echo "Inline inquiry image prices patch applied."

      - name: Enable mixed inquiry options in cart and checkout
        run: |
          set -e
          python3 scripts/patch_mixed_inquiry_cart.py
          grep -q "bool get isInquiryOption" astro_mobile/lib/services/cart_service.dart
          grep -q "astro_create_mixed_order" astro_mobile/lib/screens/checkout_screen.dart
          grep -q "astro_create_mixed_order" astro_mobile/lib/screens/bank_transfer_screen.dart
          grep -q "CartService.instance.addInquiryOption" astro_mobile/lib/screens/product_inquiry_inline.dart
          echo "Mixed inquiry cart and payment integration patch applied."

      - name: Fix category carousel spacing and featured products heading
        run: |
          set -e
          python3 scripts/patch_home_categories_layout.py
          grep -q "height: 196" astro_mobile/lib/screens/home_screen.dart
          grep -q "منتجات مختارة" astro_mobile/lib/screens/home_screen.dart
          echo "Home category carousel and featured heading layout patch applied."

      - name: Make cart confirmation messages non-blocking
        run: |
          set -e
          python3 scripts/patch_short_cart_snackbars.py
          grep -q "duration: const Duration(seconds: 2)" astro_mobile/lib/screens/home_screen.dart
          grep -q "messenger.hideCurrentSnackBar()" astro_mobile/lib/screens/home_screen.dart
          grep -q "duration: const Duration(seconds: 2)" astro_mobile/lib/screens/product_detail_screen.dart
          echo "Cart confirmation messages now dismiss after two seconds."

      - name: Persist cart and remove blocking add-to-cart messages
        run: |
          set -e
          python3 scripts/patch_persistent_cart_and_remove_add_snackbar.py
          grep -q "Future<void> initialize()" astro_mobile/lib/services/cart_service.dart
          grep -q "SharedPreferences.getInstance()" astro_mobile/lib/services/cart_service.dart
          grep -q "await CartService.instance.initialize()" astro_mobile/lib/main.dart
          echo "Cart persistence and non-blocking add-to-cart behavior applied."

      - name: Upload extracted Flutter source for safe inspection
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-MOBILE-FLUTTER-SOURCE-INSPECTION
          path: astro_mobile/
          if-no-files-found: error
          retention-days: 3

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-astro-mobile-v1
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: astro_mobile
        run: flutter create --platforms=android .

      - name: Ensure Gradle plugin repositories
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          android = Path("astro_mobile/android")
          candidates = [android / "settings.gradle.kts", android / "settings.gradle"]
          settings = next((p for p in candidates if p.exists()), None)
          if settings is None: raise SystemExit("Gradle settings file not found")
          source = settings.read_text()
          match = re.search(r'(?m)^\\s*pluginManagement\\s*\\{', source)
          if not match: raise SystemExit("pluginManagement block not found")
          start = source.find("{", match.start()); depth = 0; end = None
          for i in range(start, len(source)):
              if source[i] == "{": depth += 1
              elif source[i] == "}":
                  depth -= 1
                  if depth == 0: end = i; break
          if end is None: raise SystemExit("Unclosed pluginManagement block")
          block = source[start:end + 1]
          repos = re.search(r'(?m)^\\s*repositories\\s*\\{', block)
          required = ["google()", "gradlePluginPortal()", "mavenCentral()"]
          if repos:
              rstart = block.find("{", repos.start()); rdepth = 0; rend = None
              for i in range(rstart, len(block)):
                  if block[i] == "{": rdepth += 1
                  elif block[i] == "}":
                      rdepth -= 1
                      if rdepth == 0: rend = i; break
              if rend is None: raise SystemExit("Unclosed repositories block")
              existing = block[rstart + 1:rend]
              missing = [item for item in required if item not in existing]
              if missing: block = block[:rend] + "\\n" + "\\n".join("        " + item for item in missing) + "\\n    " + block[rend:]
          else: block = block[:1] + "\\n    repositories {\\n        google()\\n        mavenCentral()\\n        gradlePluginPortal()\\n    }\\n" + block[1:]
          mirror_repo = ('maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }' if settings.suffix == ".kts" else "maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }")
          if "maven-central.storage-download.googleapis.com" not in block:
              block = re.sub(r'(repositories\\s*\\{)', lambda m: m.group(1) + "\\n        " + mirror_repo, block, count=1)
          source = source[:start] + block + source[end + 1:]
          mirror_repo = ('maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }' if settings.suffix == ".kts" else "maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }")
          dep_match = re.search(r'(?m)^\\s*dependencyResolutionManagement\\s*\\{', source)
          if dep_match:
              dep_start = source.find("{", dep_match.start()); dep_depth = 0; dep_end = None
              for i in range(dep_start, len(source)):
                  if source[i] == "{": dep_depth += 1
                  elif source[i] == "}":
                      dep_depth -= 1
                      if dep_depth == 0: dep_end = i; break
              if dep_end is None: raise SystemExit("Unclosed dependencyResolutionManagement block")
              dep_block = source[dep_start:dep_end + 1]
              if "repositories {" not in dep_block: dep_block = dep_block[:1] + "\\n    repositories {\\n        google()\\n        " + mirror_repo + "\\n        mavenCentral()\\n    }\\n" + dep_block[1:]
              elif "maven-central.storage-download.googleapis.com" not in dep_block: dep_block = re.sub(r'(repositories\\s*\\{)', lambda m: m.group(1) + "\\n        " + mirror_repo, dep_block, count=1)
              source = source[:dep_start] + dep_block + source[dep_end + 1:]
          else: source += "\\ndependencyResolutionManagement {\\n    repositories {\\n        google()\\n        " + mirror_repo + "\\n        mavenCentral()\\n    }\\n}\\n"
          settings.write_text(source)
          print("Configured plugin and dependency repositories with the Google Maven Central mirror first.")
          PYCODE

      - name: Add Google-hosted Maven Central mirror for Android dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          android = Path("astro_mobile/android")
          root = android / "build.gradle.kts"
          if not root.exists(): root = android / "build.gradle"
          if not root.exists(): raise SystemExit("Android root Gradle file not found")
          source = root.read_text(); mirror_url = "https://maven-central.storage-download.googleapis.com/maven2/"
          if mirror_url not in source:
              mirror = ('maven { url = uri("' + mirror_url + '") }' if root.suffix == ".kts" else "maven { url '" + mirror_url + "' }")
              if "mavenCentral()" not in source: raise SystemExit("Expected mavenCentral() repository declaration was not found")
              source = source.replace("mavenCentral()", mirror + "\\n        mavenCentral()", 1); root.write_text(source)
          if mirror_url not in root.read_text(): raise SystemExit("Maven mirror was not added")
          print("Added Google-hosted Maven Central mirror before the standard Maven Central repository.")
          PY

      - name: Configure Supabase email deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("astro_mobile/android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(); scheme = "com.astromobile.store"; host = "login-callback"
          if f'android:scheme="{scheme}"' not in content:
              intent_filter = f'''\n                  <intent-filter>\n                      <action android:name="android.intent.action.VIEW" />\n                      <category android:name="android.intent.category.DEFAULT" />\n                      <category android:name="android.intent.category.BROWSABLE" />\n                      <data android:scheme="{scheme}" android:host="{host}" />\n                  </intent-filter>\n              '''
              if "</activity>" not in content: raise SystemExit("MainActivity closing tag not found in AndroidManifest.xml")
              content = content.replace("</activity>", intent_filter + "\\n        </activity>", 1); manifest.write_text(content)
          print(f"Configured Android auth callback: {scheme}://{host}")
          PY

      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          android = Path("astro_mobile/android"); settings = android / "settings.gradle.kts"; app = android / "app" / "build.gradle.kts"
          if not settings.exists(): settings = android / "settings.gradle"
          if not app.exists(): app = android / "app" / "build.gradle"
          if not settings.exists() or not app.exists(): raise SystemExit("Android Gradle files not found")
          kotlin = app.suffix == ".kts"; s = settings.read_text(); a = app.read_text()
          if "com.google.gms.google-services" not in s:
              plugin = ('    id("com.google.gms.google-services") version "4.4.2" apply false' if settings.suffix == ".kts" else "    id 'com.google.gms.google-services' version '4.4.2' apply false")
              s = re.sub(r'plugins\\s*\\{', lambda m: m.group(0) + "\\n" + plugin, s, count=1); settings.write_text(s)
          if "com.google.gms.google-services" not in a:
              plugin = '    id("com.google.gms.google-services")' if kotlin else "    id 'com.google.gms.google-services'"
              a = re.sub(r'plugins\\s*\\{', lambda m: m.group(0) + "\\n" + plugin, a, count=1)
          if kotlin:
              if "isCoreLibraryDesugaringEnabled" not in a: a = re.sub(r'compileOptions\\s*\\{', 'compileOptions {\\n        isCoreLibraryDesugaringEnabled = true', a, count=1)
              a = re.sub(r'(?m)^\\s*coreLibraryDesugaring\\(.*\\)\\s*$', '', a); dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              a = re.sub(r'minSdk\\s*=\\s*flutter\\.minSdkVersion', 'minSdk = 23', a)
          else:
              if "coreLibraryDesugaringEnabled true" not in a: a = re.sub(r'compileOptions\\s*\\{', 'compileOptions {\\n        coreLibraryDesugaringEnabled true', a, count=1)
              a = re.sub(r'(?m)^\\s*coreLibraryDesugaring\\s+.*$', '', a); dependency = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              a = re.sub(r'minSdkVersion\\s+flutter\\.minSdkVersion', 'minSdkVersion 23', a)
          if "compileOptions {" not in a: raise SystemExit("compileOptions block not found")
          if re.search(r'(?m)^\\s*dependencies\\s*\\{', a): a = re.sub(r'(?m)^(\\s*dependencies\\s*\\{)', lambda m: m.group(1) + "\\n" + dependency, a, count=1)
          else: a += "\\n\\ndependencies {\\n" + dependency + "\\n}\\n"
          app.write_text(a)
          if "desugar_jdk_libs:2.1.4" not in a: raise SystemExit("Desugaring dependency missing")
          if "com.google.gms.google-services" not in app.read_text(): raise SystemExit("Firebase Gradle plugin missing")
          print("Android Gradle configuration completed successfully.")
          PY

      - name: Disable crashing Android release lint tasks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          android = Path("astro_mobile/android"); candidates = [android / "build.gradle.kts", android / "build.gradle"]
          root = next((p for p in candidates if p.exists()), None)
          if root is None: raise SystemExit("Android root Gradle file not found")
          content = root.read_text()
          snippet = '''\n          subprojects {\n              tasks.configureEach {\n                  if (name.startsWith("lintVital")) {\n                      enabled = false\n                  }\n              }\n          }\n          '''
          if 'name.startsWith("lintVital")' not in content: root.write_text(content.rstrip() + "\\n" + snippet)
          print("Release lint configuration completed.")
          PY

      - name: Add Firebase config
        run: |
          test -f google-services.json
          mkdir -p astro_mobile/android/app
          cp google-services.json astro_mobile/android/app/google-services.json

      - name: Get dependencies
        working-directory: astro_mobile
        run: flutter pub get

      - name: Clean project
        working-directory: astro_mobile
        run: flutter clean

      - name: Get dependencies again
        working-directory: astro_mobile
        run: flutter pub get

      - name: Generate ASTRO MOBILE launcher icon
        working-directory: astro_mobile
        run: dart run flutter_launcher_icons

      - name: Build APK (retry transient repository rate limits)
        working-directory: astro_mobile
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "APK build attempt ${attempt}/3"
            if flutter build apk --release; then exit 0; fi
            if [ "${attempt}" -lt 3 ]; then
              wait_seconds=$((attempt * 30))
              echo "Build failed; waiting ${wait_seconds}s before retry (helps with Maven HTTP 429 rate limits)."
              sleep "${wait_seconds}"
            fi
          done
          echo "APK build failed after 3 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-MOBILE-BLUE-BRAND
          path: astro_mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Fix category carousel spacing and featured products heading
        run: |
          set -e
          python3 scripts/patch_home_categories_layout.py
          grep -q "height: 196" astro_mobile/lib/screens/home_screen.dart
          grep -q "Keep the featured-products heading clearly separated" astro_mobile/lib/screens/home_screen.dart
          echo "Home category carousel and featured heading layout patch applied."

