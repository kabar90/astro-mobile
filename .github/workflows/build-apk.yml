
name: Build ASTRO MOBILE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ASTRO_MOBILE_FIXED_SOURCE.zip'
      - 'google-services.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf astro_mobile ASTRO_MOBILE_FIXED_SOURCE
          unzip -o ASTRO_MOBILE_FIXED_SOURCE.zip
          test -d ASTRO_MOBILE_FIXED_SOURCE/astro_mobile_redesign
          mv ASTRO_MOBILE_FIXED_SOURCE/astro_mobile_redesign astro_mobile

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: astro_mobile
        run: flutter create --platforms=android .

      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          android = Path("astro_mobile/android")

          settings = android / "settings.gradle.kts"
          app = android / "app" / "build.gradle.kts"

          if not settings.exists():
              settings = android / "settings.gradle"

          if not app.exists():
              app = android / "app" / "build.gradle"

          if not settings.exists() or not app.exists():
              raise SystemExit("Android Gradle files not found")

          kotlin = app.suffix == ".kts"

          s = settings.read_text()
          a = app.read_text()

          if "com.google.gms.google-services" not in s:
              plugin = (
                  '    id("com.google.gms.google-services") version "4.4.2" apply false'
                  if settings.suffix == ".kts"
                  else "    id 'com.google.gms.google-services' version '4.4.2' apply false"
              )
              s = re.sub(
                  r'plugins\s*\{',
                  lambda m: m.group(0) + "\n" + plugin,
                  s,
                  count=1
              )
              settings.write_text(s)

          if "com.google.gms.google-services" not in a:
              plugin = (
                  '    id("com.google.gms.google-services")'
                  if kotlin
                  else "    id 'com.google.gms.google-services'"
              )
              a = re.sub(
                  r'plugins\s*\{',
                  lambda m: m.group(0) + "\n" + plugin,
                  a,
                  count=1
              )

          if kotlin:
              if "isCoreLibraryDesugaringEnabled" not in a:
                  a = re.sub(
                      r'compileOptions\s*\{',
                      'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                      a,
                      count=1
                  )

              a = re.sub(
                  r'(?m)^\s*coreLibraryDesugaring\(.*\)\s*$',
                  '',
                  a
              )

              dependency = (
                  '    coreLibraryDesugaring('
                  '"com.android.tools:desugar_jdk_libs:2.1.4")'
              )

              a = re.sub(
                  r'minSdk\s*=\s*flutter\.minSdkVersion',
                  'minSdk = 23',
                  a
              )

          else:
              if "coreLibraryDesugaringEnabled true" not in a:
                  a = re.sub(
                      r'compileOptions\s*\{',
                      'compileOptions {\n        coreLibraryDesugaringEnabled true',
                      a,
                      count=1
                  )

              a = re.sub(
                  r'(?m)^\s*coreLibraryDesugaring\s+.*$',
                  '',
                  a
              )

              dependency = (
                  "    coreLibraryDesugaring "
                  "'com.android.tools:desugar_jdk_libs:2.1.4'"
              )

              a = re.sub(
                  r'minSdkVersion\s+flutter\.minSdkVersion',
                  'minSdkVersion 23',
                  a
              )

          if "compileOptions {" not in a:
              raise SystemExit("compileOptions block not found")

          if re.search(r'(?m)^\s*dependencies\s*\{', a):
              a = re.sub(
                  r'(?m)^(\s*dependencies\s*\{)',
                  lambda m: m.group(1) + "\n" + dependency,
                  a,
                  count=1
              )
          else:
              a += "\n\ndependencies {\n" + dependency + "\n}\n"

          app.write_text(a)

          if "desugar_jdk_libs:2.1.4" not in a:
              raise SystemExit("Desugaring dependency missing")

          if "com.google.gms.google-services" not in app.read_text():
              raise SystemExit("Firebase Gradle plugin missing")

          print("Android Gradle configuration completed successfully.")
          PY

      - name: Disable crashing Android release lint tasks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android = Path("astro_mobile/android")

          candidates = [
              android / "build.gradle.kts",
              android / "build.gradle"
          ]

          root = next((p for p in candidates if p.exists()), None)

          if root is None:
              raise SystemExit("Android root Gradle file not found")

          content = root.read_text()

          snippet = """
          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          """

          if 'name.startsWith("lintVital")' not in content:
              root.write_text(content.rstrip() + "\n" + snippet)

          print("Release lint configuration completed.")
          PY

      - name: Add Firebase config
        run: |
          test -f google-services.json
          mkdir -p astro_mobile/android/app
          cp google-services.json astro_mobile/android/app/google-services.json

      - name: Get dependencies
        working-directory: astro_mobile
        run: flutter pub get

      - name: Clean project
        working-directory: astro_mobile
        run: flutter clean

      - name: Get dependencies again
        working-directory: astro_mobile
        run: flutter pub get

      - name: Build APK
        working-directory: astro_mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-MOBILE-FIXED
          path: astro_mobile/build/app/outputs/flutter-apk/app-release.apk
