name: Deploy ASTRO MOBILE Admin Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'admin-dashboard.zip'
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-admin-recovery
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare dashboard and download page
        run: |
          set -e
          rm -rf public
          mkdir -p public
          test -d admin
          cp -R admin/. public/
          test -f public/index.html
          test -f public/download.html
          echo "Prepared GitHub Pages site:"
          find public -maxdepth 2 -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
