
name: Build ASTRO MOBILE Play AAB

on:
  workflow_dispatch:
  push:
    branches:
      - play-aab-fix-flutter-3385

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          rm -rf astro_mobile extracted_project
          mkdir -p extracted_project
          unzip -o ASTRO_MOBILE_POINTS_PAYMENT_UI.zip -d extracted_project

          PROJECT_DIR="$(find extracted_project -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find pubspec.yaml in the extracted archive."
            find extracted_project -maxdepth 4 -type f | sort | head -100
            exit 1
          fi

          mv "$PROJECT_DIR" astro_mobile
          rm -rf extracted_project
          test -f astro_mobile/pubspec.yaml
          echo "Flutter project found and extracted successfully."

      - name: Add searchable delivery city picker
        run: |
          set -e
          python3 scripts/patch_delivery_city_search.py
          grep -q "ابحث عن مدينتك" astro_mobile/lib/screens/checkout_screen.dart
          grep -q "لم يتم العثور على المدينة" astro_mobile/lib/screens/checkout_screen.dart
          echo "Searchable delivery city picker verified."

      - name: Fix duplicate image downloads and enable persistent cache
        run: |
          set -e
          python3 scripts/patch_image_cache.py
          grep -q "CachedNetworkImage(" astro_mobile/lib/widgets/astro_cached_image.dart
          grep -q "maxNrOfCacheObjects: 500" astro_mobile/lib/widgets/astro_cached_image.dart
          echo "Single-request persistent image cache patch applied."

      - name: Keep the last product and category catalogue available offline
        run: |
          set -e
          python3 scripts/patch_offline_catalog_cache.py
          grep -q "Do not start realtime after a failed REST request" astro_mobile/lib/services/product_repository.dart
          grep -q "static Stream<List<StoreCategory>> watchCategories()" astro_mobile/lib/services/product_repository.dart
          echo "Offline-first product and category catalogue patch applied."

      - name: Bind Firebase notifications automatically to signed-in customers
        run: |
          set -e
          python3 scripts/patch_notification_auth_binding.py
          grep -q "Future<void> _bindAuthenticatedUser()" astro_mobile/lib/services/notification_service.dart
          grep -q "onAuthStateChange.listen" astro_mobile/lib/services/notification_service.dart
          grep -q "await _bindAuthenticatedUser()" astro_mobile/lib/services/notification_service.dart
          grep -q "bindCurrentCustomerPhone(_normalizedPhone())" astro_mobile/lib/screens/account_screen.dart
          echo "Automatic customer FCM token binding verified."

      - name: Add independent service inquiries screen
        run: |
          set -e
          python3 scripts/patch_service_inquiries.py
          grep -q "class ServiceInquiriesScreen" astro_mobile/lib/screens/service_inquiries_screen.dart
          grep -q "خدمات الصيانة والبرمجة" astro_mobile/lib/screens/home_screen.dart
          echo "Service inquiries screen installed."

      - name: Reduce catalogue REST response payload
        run: |
          set -e
          python3 scripts/patch_catalog_select_columns.py
          grep -q "select('id,name,price,category,stock,description,image_url,is_active,colors,subcategory_id,reward_points,allow_points_payment')" astro_mobile/lib/services/product_repository.dart
          grep -q "select('id,name,parent_id,sort_order,is_active,image_url')" astro_mobile/lib/services/product_repository.dart
          echo "Catalogue queries limited to required columns."

      - name: Load product descriptions only on demand
        run: |
          set -e
          python3 scripts/patch_product_detail_lazy_load.py
          grep -q "select('id,name,price,category,stock,image_url,is_active,colors,subcategory_id,reward_points,allow_points_payment')" astro_mobile/lib/services/product_repository.dart
          grep -q "getProductDescription" astro_mobile/lib/services/product_repository.dart
          grep -q "_loadProductDescription" astro_mobile/lib/screens/product_detail_screen.dart
          echo "Lazy product description loading and offline detail cache applied."

      - name: Avoid duplicate initial catalogue realtime snapshots
        run: |
          set -e
          python3 scripts/patch_realtime_catalogue_refresh.py
          grep -q "astro-products-catalogue" astro_mobile/lib/services/product_repository.dart
          grep -q "astro-categories-catalogue" astro_mobile/lib/services/product_repository.dart
          grep -q "onPostgresChanges" astro_mobile/lib/services/product_repository.dart
          echo "Realtime now refreshes only after actual table changes."

      - name: Show priced inquiry images inside the matching category
        run: |
          set -e
          python3 scripts/patch_product_inquiry_inline_images.py
          grep -q "الخيارات المتوفرة بالصور والأسعار" astro_mobile/lib/screens/product_inquiry_inline.dart
          grep -q "admin_image_items" astro_mobile/supabase/product_inquiries.sql
          echo "Inline inquiry image prices patch applied."

      - name: Enable mixed inquiry options in cart and checkout
        run: |
          set -e
          python3 scripts/patch_mixed_inquiry_cart.py
          grep -q "bool get isInquiryOption" astro_mobile/lib/services/cart_service.dart
          grep -q "astro_create_mixed_order" astro_mobile/lib/screens/checkout_screen.dart
          grep -q "astro_create_mixed_order" astro_mobile/lib/screens/bank_transfer_screen.dart
          grep -q "CartService.instance.addInquiryOption" astro_mobile/lib/screens/product_inquiry_inline.dart
          echo "Mixed inquiry cart and payment integration patch applied."

      - name: Fix category carousel spacing and featured products heading
        run: |
          set -e
          python3 scripts/patch_home_categories_layout.py
          grep -q "height: 196" astro_mobile/lib/screens/home_screen.dart
          grep -q "childAspectRatio: displaySettings.mainLayout == 'grid_3' ? .66 : .95" astro_mobile/lib/screens/home_screen.dart
          grep -q "mainAxisSpacing: 18" astro_mobile/lib/screens/home_screen.dart
          grep -q "منتجات مختارة" astro_mobile/lib/screens/home_screen.dart
          echo "Category grid cards now fit their badges; featured heading spacing verified."

      - name: Use Supabase category images in the home carousel
        run: |
          set -e
          python3 scripts/patch_home_category_remote_images.py
          grep -q "child: item.imageUrl.isNotEmpty" astro_mobile/lib/screens/home_screen.dart
          grep -q "imageUrl: item.imageUrl" astro_mobile/lib/screens/home_screen.dart
          echo "Home category carousel now uses the same Supabase image_url as the all-categories page."

      - name: Make cart confirmation messages non-blocking
        run: |
          set -e
          python3 scripts/patch_short_cart_snackbars.py
          grep -q "duration: const Duration(seconds: 2)" astro_mobile/lib/screens/home_screen.dart
          grep -q "messenger.hideCurrentSnackBar()" astro_mobile/lib/screens/home_screen.dart
          grep -q "duration: const Duration(seconds: 2)" astro_mobile/lib/screens/product_detail_screen.dart
          echo "Cart confirmation messages now dismiss after two seconds."

      - name: Persist cart and remove blocking add-to-cart messages
        run: |
          set -e
          python3 scripts/patch_persistent_cart_and_remove_add_snackbar.py
          grep -q "Future<void> initialize()" astro_mobile/lib/services/cart_service.dart
          grep -q "SharedPreferences.getInstance()" astro_mobile/lib/services/cart_service.dart
          grep -q "await CartService.instance.initialize()" astro_mobile/lib/main.dart
          echo "Cart persistence and non-blocking add-to-cart behavior applied."

      - name: Show multiple independently priced offer products in the app
        run: |
          set -e
          python3 scripts/patch_multi_product_offers.py
          grep -q "ASTRO_MULTI_PRODUCT_OFFERS_PATCH" astro_mobile/lib/screens/home_screen.dart
          grep -q "show_on_home.*true" scripts/patch_multi_product_offers.py
          grep -Fq "item.product?.price == product.price" astro_mobile/lib/services/cart_service.dart
          echo "All active offers remain independent of show_on_home; home shows featured only; all-offers screen uses ListView.separated."

      - name: Route the offers category to all active offers
        run: |
          set -e
          python3 scripts/patch_offers_category_route.py
          grep -q "_AllOffersScreen(products: products)" astro_mobile/lib/screens/home_screen.dart
          grep -q "تصفح العروض النشطة" astro_mobile/lib/screens/home_screen.dart
          echo "Offers category routing uses the database category without duplicate hardcoded shortcut."

      - name: Match every offer's product rows to the category card layout
        run: |
          set -e
          python3 scripts/patch_offer_products_layout.py
          grep -q "All products inside offer details now use the dark horizontal category-style card." /dev/null || true
          grep -q "color: const Color(0xFF0B1B49)" astro_mobile/lib/screens/home_screen.dart
          grep -q "width: 112" astro_mobile/lib/screens/home_screen.dart
          echo "Every product in every active offer now uses the same horizontal dark card layout."

      - name: Apply ASTRO neon blue and purple visual identity
        run: |
          set -e
          python3 scripts/patch_neon_blue_purple_theme.py
          grep -q "astroPurple = Color(0xFFB45CFF)" astro_mobile/lib/main.dart
          grep -q "scaffoldBackgroundColor: astroBackground" astro_mobile/lib/main.dart
          echo "Neon blue/purple theme applied across all app screens."

      - name: Fix remaining low-contrast white controls
        run: |
          set -e
          python3 scripts/patch_neon_form_controls.py
          grep -q "fillColor: astroSurfaceAlt" astro_mobile/lib/screens/checkout_screen.dart
          grep -q "backgroundColor: astroBlue" astro_mobile/lib/screens/account_screen.dart
          grep -q "astroPurple.withOpacity(.72)" astro_mobile/lib/screens/home_screen.dart
          echo "Product details, login, checkout, transfer and category filters use readable neon controls."

      - name: Compact featured offers on the home page
        run: |
          set -e
          python3 scripts/patch_home_offers_compact.py
          grep -q "height: 258" astro_mobile/lib/screens/home_screen.dart
          grep -q "width: 174" astro_mobile/lib/screens/home_screen.dart
          grep -q "childAspectRatio: 1.0" astro_mobile/lib/screens/home_screen.dart
          grep -q "height: 70" astro_mobile/lib/screens/home_screen.dart
          grep -q "aspectRatio: 1.8" astro_mobile/lib/screens/home_screen.dart
          echo "Featured offers now match the compact latest-products card size."

      - name: Normalize every featured offer into one consistent card
        run: |
          set -e
          python3 scripts/patch_home_offers_uniform.py
          grep -q "_homeOfferPreviewCard" astro_mobile/lib/screens/home_screen.dart
          grep -q "height: 258" astro_mobile/lib/screens/home_screen.dart
          grep -q "actionLabel: 'تصفح الباقة'" astro_mobile/lib/screens/home_screen.dart
          grep -Fq "bundleEntries.first['product']" astro_mobile/lib/screens/home_screen.dart
          grep -q "BundleDetailsScreen(" astro_mobile/lib/screens/home_screen.dart
          echo "All featured offers use consistent cards, bundle images have a product-image fallback, and homepage navigation opens bundle details before checkout."

      - name: Show original and bundle prices on homepage bundle cards
        run: |
          set -e
          python3 scripts/patch_home_bundle_original_prices.py
          grep -q "originalTotal: originalBundleTotal" astro_mobile/lib/screens/home_screen.dart
          grep -q "'price': p.price" astro_mobile/lib/screens/home_screen.dart
          grep -q "'quantity': entry\['quantity'\]" astro_mobile/lib/screens/home_screen.dart
          grep -q "TextDecoration.lineThrough" astro_mobile/lib/screens/home_screen.dart
          echo "Homepage bundle cards show crossed-out original total beside bundle price; bundle details receive each product price and quantity."

      - name: Add ASTRO analytics first-open and registration tracking
        run: |
          set -e
          python3 scripts/patch_analytics_tracking.py
          grep -q "AstroAnalyticsService.recordFirstOpen" astro_mobile/lib/main.dart
          grep -q "astro_installation_id" astro_mobile/lib/screens/account_screen.dart
          test -f astro_mobile/lib/services/astro_analytics_service.dart
          echo "First-open and install attribution tracking applied."

      - name: Launch app without waiting for Firebase Messaging
        run: |
          set -e
          python3 scripts/patch_nonblocking_firebase_startup.py
          python3 - <<'PY'
          from pathlib import Path
          source = Path("astro_mobile/lib/main.dart").read_text()
          if "unawaited(_initializeBackgroundServices())" not in source:
              raise SystemExit("Background startup call is missing.")
          main_body = source.split("Future<void> main() async {", 1)[1].split("  unawaited(_initializeBackgroundServices());", 1)[0]
          if "await NotificationService.instance.initialize()" in main_body:
              raise SystemExit("Firebase initialization must not block main().")
          if "await NotificationService.instance.initialize()" not in source:
              raise SystemExit("Background FCM initialization is missing.")
          print("Verified FCM initialization runs only after runApp.")
          PY
          echo "App startup is independent of FCM token registration and analytics."

      - name: Upload extracted Flutter source for safe inspection
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-MOBILE-FLUTTER-SOURCE-INSPECTION
          path: astro_mobile/
          if-no-files-found: error
          retention-days: 3

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-astro-mobile-v1
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: astro_mobile
        run: flutter create --platforms=android .

      - name: Set unique Android application ID for new Play Console listing
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          android = Path("astro_mobile/android/app")
          app = next((p for p in (android / "build.gradle.kts", android / "build.gradle") if p.exists()), None)
          if app is None:
              raise SystemExit("Android app Gradle file not found")
          source = app.read_text()
          target = "ly.astromobile.store"
          if app.suffix == ".kts":
              source, count = re.subn(r'(?m)^\s*namespace\s*=\s*"[^"]+"', f'    namespace = "{target}"', source, count=1)
              if count != 1: raise SystemExit("Could not set Android namespace")
              source, count = re.subn(r'(?m)^\s*applicationId\s*=\s*"[^"]+"', f'        applicationId = "{target}"', source, count=1)
          else:
              source, count = re.subn(r'(?m)^\s*namespace\s+["\'][^"\']+["\']', f'    namespace "{target}"', source, count=1)
              if count != 1: raise SystemExit("Could not set Android namespace")
              source, count = re.subn(r'(?m)^\s*applicationId\s+["\'][^"\']+["\']', f'        applicationId "{target}"', source, count=1)
          if count != 1: raise SystemExit("Could not set Android applicationId")
          app.write_text(source)
          if target not in app.read_text(): raise SystemExit("New Android package ID verification failed")
          print("Android namespace and applicationId set to ly.astromobile.store.")
          PY

      - name: Align Android launcher activity with the new package
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          root = Path('astro_mobile/android/app/src/main')
          target = 'ly.astromobile.store'
          files = list(root.rglob('MainActivity.kt')) + list(root.rglob('MainActivity.java'))
          if len(files) != 1:
              raise SystemExit(f'Expected one MainActivity source, found {len(files)}')
          src = files[0]
          lines = src.read_text().splitlines()
          indexes = [i for i, line in enumerate(lines) if line.strip().startswith('package ')]
          if len(indexes) != 1:
              raise SystemExit('Could not identify MainActivity package declaration')
          lines[indexes[0]] = 'package ' + target
          destination = root / ('java' if src.suffix == '.java' else 'kotlin')
          for part in target.split('.'):
              destination = destination / part
          destination = destination / src.name
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text('\n'.join(lines) + '\n')
          if src != destination:
              src.unlink()
          if 'package ' + target not in destination.read_text():
              raise SystemExit('MainActivity package verification failed')
          print('MainActivity package aligned to ' + target)
          PY
          grep -R -q '^package ly.astromobile.store$' astro_mobile/android/app/src/main
      - name: Set Android launcher app name to Astro Mobile
        run: |
          set -e
          python3 scripts/patch_app_display_name.py
          grep -q 'android:label="Astro Mobile"' astro_mobile/android/app/src/main/AndroidManifest.xml
          echo "Android launcher name verified as Astro Mobile."

      - name: Ensure Gradle plugin repositories
        run: |
          set -e
          python3 - <<'PYCODE'
          from pathlib import Path

          android = Path("astro_mobile/android")
          settings = next((p for p in (android / "settings.gradle.kts", android / "settings.gradle") if p.exists()), None)
          if settings is None:
              raise SystemExit("Gradle settings file not found")

          source = settings.read_text()
          mirror_url = "https://maven-central.storage-download.googleapis.com/maven2/"
          is_kts = settings.suffix == ".kts"
          mirror = (
              f'maven {{ url = uri("{mirror_url}") }}'
              if is_kts else
              f"maven {{ url '{mirror_url}' }}"
          )

          def add_mirror_to_block(text, block_name):
              token = block_name + " {"
              start = text.find(token)
              if start < 0:
                  return text, False
              open_brace = text.find("{", start)
              depth = 0
              close_brace = None
              for index in range(open_brace, len(text)):
                  if text[index] == "{":
                      depth += 1
                  elif text[index] == "}":
                      depth -= 1
                      if depth == 0:
                          close_brace = index
                          break
              if close_brace is None:
                  raise SystemExit(f"Unclosed {block_name} block")
              block = text[start:close_brace + 1]
              if mirror_url not in block:
                  repo_token = "repositories {"
                  repo_at = block.find(repo_token)
                  if repo_at < 0:
                      insertion = "repositories {\n        google()\n        " + mirror + "\n        mavenCentral()\n    }\n    "
                      block = block[:1 + block.find("{")] + "\n    " + insertion + block[1 + block.find("{"):]
                  else:
                      repo_open = block.find("{", repo_at)
                      block = block[:repo_open + 1] + "\n        " + mirror + block[repo_open + 1:]
              return text[:start] + block + text[close_brace + 1:], True

          source, found = add_mirror_to_block(source, "pluginManagement")
          if not found:
              raise SystemExit("pluginManagement block not found in generated settings file")

          source, found_dep = add_mirror_to_block(source, "dependencyResolutionManagement")
          if not found_dep:
              source += (
                  "\ndependencyResolutionManagement {\n"
                  "    repositories {\n"
                  "        google()\n"
                  f"        {mirror}\n"
                  "        mavenCentral()\n"
                  "    }\n"
                  "}\n"
              )

          settings.write_text(source)
          check = settings.read_text()
          if mirror_url not in check or "pluginManagement" not in check:
              raise SystemExit("Gradle repository mirror verification failed")
          print("Gradle plugin and dependency repositories configured.")
          PYCODE

      - name: Add Google-hosted Maven Central mirror for Android dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          android = Path("astro_mobile/android")
          root = android / "build.gradle.kts"
          if not root.exists(): root = android / "build.gradle"
          if not root.exists(): raise SystemExit("Android root Gradle file not found")
          source = root.read_text(); mirror_url = "https://maven-central.storage-download.googleapis.com/maven2/"
          if mirror_url not in source:
              mirror = ('maven { url = uri("' + mirror_url + '") }' if root.suffix == ".kts" else "maven { url '" + mirror_url + "' }")
              if "mavenCentral()" not in source: raise SystemExit("Expected mavenCentral() repository declaration was not found")
              source = source.replace("mavenCentral()", mirror + "\n        mavenCentral()", 1); root.write_text(source)
          if mirror_url not in root.read_text(): raise SystemExit("Maven mirror was not added")
          print("Added Google-hosted Maven Central mirror before the standard Maven Central repository.")
          PY

      - name: Configure Supabase email deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("astro_mobile/android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(); scheme = "com.astromobile.store"; host = "login-callback"
          if f'android:scheme="{scheme}"' not in content:
              intent_filter = f'''\n                  <intent-filter>\n                      <action android:name="android.intent.action.VIEW" />\n                      <category android:name="android.intent.category.DEFAULT" />\n                      <category android:name="android.intent.category.BROWSABLE" />\n                      <data android:scheme="{scheme}" android:host="{host}" />\n                  </intent-filter>\n              '''
              if "</activity>" not in content: raise SystemExit("MainActivity closing tag not found in AndroidManifest.xml")
              content = content.replace("</activity>", intent_filter + "\n        </activity>", 1); manifest.write_text(content)
          print(f"Configured Android auth callback: {scheme}://{host}")
          PY

      - name: Configure Android Gradle
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          android = Path("astro_mobile/android")
          settings = next((p for p in (android / "settings.gradle.kts", android / "settings.gradle") if p.exists()), None)
          app = next((p for p in (android / "app" / "build.gradle.kts", android / "app" / "build.gradle") if p.exists()), None)
          if settings is None or app is None:
              raise SystemExit("Android Gradle files not found")

          def add_plugin(path, plugin_line):
              content = path.read_text()
              if "com.google.gms.google-services" not in content:
                  marker = "plugins {"
                  pos = content.find(marker)
                  if pos < 0:
                      raise SystemExit(f"plugins block not found in {path}")
                  insert_at = pos + len(marker)
                  content = content[:insert_at] + "\n" + plugin_line + content[insert_at:]
                  path.write_text(content)
              if "com.google.gms.google-services" not in path.read_text():
                  raise SystemExit(f"Firebase Gradle plugin was not added to {path}")

          is_kts = app.suffix == ".kts"
          settings_plugin = (
              '    id("com.google.gms.google-services") version "4.4.2" apply false'
              if settings.suffix == ".kts" else
              "    id 'com.google.gms.google-services' version '4.4.2' apply false"
          )
          app_plugin = (
              '    id("com.google.gms.google-services")'
              if is_kts else
              "    id 'com.google.gms.google-services'"
          )
          add_plugin(settings, settings_plugin)
          add_plugin(app, app_plugin)

          app_text = app.read_text()
          if is_kts:
              if "isCoreLibraryDesugaringEnabled = true" not in app_text:
                  marker = "compileOptions {"
                  pos = app_text.find(marker)
                  if pos < 0:
                      raise SystemExit("compileOptions block not found in Kotlin Gradle file")
                  at = pos + len(marker)
                  app_text = app_text[:at] + "\n        isCoreLibraryDesugaringEnabled = true" + app_text[at:]
              if "coreLibraryDesugaring(" not in app_text:
                  marker = "dependencies {"
                  pos = app_text.find(marker)
                  dependency = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                  if pos < 0:
                      app_text += "\n\ndependencies {\n" + dependency + "}\n"
                  else:
                      at = pos + len(marker)
                      app_text = app_text[:at] + "\n" + dependency + app_text[at:]
              app_text = app_text.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
          else:
              if "coreLibraryDesugaringEnabled true" not in app_text:
                  marker = "compileOptions {"
                  pos = app_text.find(marker)
                  if pos < 0:
                      raise SystemExit("compileOptions block not found in Groovy Gradle file")
                  at = pos + len(marker)
                  app_text = app_text[:at] + "\n        coreLibraryDesugaringEnabled true" + app_text[at:]
              if "coreLibraryDesugaring " not in app_text:
                  marker = "dependencies {"
                  pos = app_text.find(marker)
                  dependency = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n"
                  if pos < 0:
                      app_text += "\n\ndependencies {\n" + dependency + "}\n"
                  else:
                      at = pos + len(marker)
                      app_text = app_text[:at] + "\n" + dependency + app_text[at:]
              app_text = app_text.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")

          app.write_text(app_text)
          if "com.google.gms.google-services" not in settings.read_text():
              raise SystemExit("Firebase plugin missing from settings")
          if "com.google.gms.google-services" not in app.read_text():
              raise SystemExit("Firebase plugin missing from app")
          if "desugar_jdk_libs:2.1.4" not in app.read_text():
              raise SystemExit("Desugaring dependency missing")
          print("Android Gradle and Firebase plugin configuration completed.")
          PY

      - name: Disable crashing Android release lint tasks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          android = Path("astro_mobile/android"); candidates = [android / "build.gradle.kts", android / "build.gradle"]
          root = next((p for p in candidates if p.exists()), None)
          if root is None: raise SystemExit("Android root Gradle file not found")
          content = root.read_text()
          snippet = '''\n          subprojects {\n              tasks.configureEach {\n                  if (name.startsWith("lintVital")) {\n                      enabled = false\n                  }\n              }\n          }\n          '''
          if 'name.startsWith("lintVital")' not in content: root.write_text(content.rstrip() + "\n" + snippet)
          print("Release lint configuration completed.")
          PY

      - name: Add Firebase config
        run: |
          test -f google-services.json
          mkdir -p astro_mobile/android/app
          cp google-services.json astro_mobile/android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("astro_mobile/android/app/google-services.json").read_text())
          target = "ly.astromobile.store"
          matches = [
              client for client in config.get("client", [])
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name") == target
          ]
          if len(matches) != 1:
              raise SystemExit(f"Firebase config must contain exactly one Android client for {target}; found {len(matches)}")
          info = matches[0]["client_info"]
          app_id = info.get("mobilesdk_app_id", "")
          project_id = config.get("project_info", {}).get("project_id", "")
          if not app_id or not project_id:
              raise SystemExit("Firebase Android client is missing app ID or project ID")
          print(f"Verified Firebase Android package: {target}")
          print(f"Verified Firebase project: {project_id}")
          print(f"Verified Firebase app ID: {app_id}")
          PY

      - name: Set Play release version
        run: |
          set -e
          sed -i 's/version: 1.2.0+3/version: 1.2.0+5/' astro_mobile/pubspec.yaml
          grep -q 'version: 1.2.0+5' astro_mobile/pubspec.yaml

      - name: Configure Google Play upload signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ASTRO_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ASTRO_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ASTRO_UPLOAD_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          mkdir -p astro_mobile/android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > astro_mobile/android/app/astro-upload-key.jks
          test -s astro_mobile/android/app/astro-upload-key.jks
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("astro_mobile/android/app")
          p = root / "build.gradle.kts"
          kotlin = p.exists()
          if not kotlin:
              p = root / "build.gradle"
          source = p.read_text()

          def matching_brace(text, open_pos):
              depth = 0
              for i in range(open_pos, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              raise SystemExit("Unbalanced Gradle braces")

          android_match = re.search(r"\bandroid\s*\{", source)
          if not android_match:
              raise SystemExit("Android Gradle block not found")
          android_open = source.find("{", android_match.start())

          signing_match = re.search(r"\bsigningConfigs\s*\{", source)
          release_config = """
                  create("release") {
                      keyAlias = "astro-mobile-upload"
                      keyPassword = System.getenv("KEY_PASSWORD")
                      storeFile = file("astro-upload-key.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                  }
          """ if kotlin else """
                  release {
                      keyAlias "astro-mobile-upload"
                      keyPassword System.getenv("KEY_PASSWORD")
                      storeFile file("astro-upload-key.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                  }
          """

          if signing_match:
              signing_open = source.find("{", signing_match.start())
              signing_close = matching_brace(source, signing_open)
              signing_body = source[signing_open + 1:signing_close]
              if not re.search(r'(?:\brelease\s*\{|\bcreate\s*\(\s*["\']release["\']\s*\))', signing_body):
                  source = source[:signing_close] + "\n" + release_config + "\n" + source[signing_close:]
          else:
              android_close = matching_brace(source, android_open)
              source = source[:android_open + 1] + "\n        signingConfigs {\n" + release_config + "\n        }\n" + source[android_open + 1:]

          build_types = re.search(r"\bbuildTypes\s*\{", source)
          if not build_types:
              raise SystemExit("buildTypes block not found")
          bt_open = source.find("{", build_types.start())
          bt_close = matching_brace(source, bt_open)
          bt_body = source[bt_open + 1:bt_close]
          release_match = re.search(r"\brelease\s*\{", bt_body)
          if not release_match:
              raise SystemExit("release build type not found")
          release_open = bt_open + 1 + bt_body.find("{", release_match.start())
          release_close = matching_brace(source, release_open)
          release_body = source[release_open + 1:release_close]
          # Never keep Flutter's generated debug signing config on a release build.
          release_body = re.sub(r"(?m)^[ \\t]*signingConfig\\s*(?:=.*|signingConfigs\\.[A-Za-z_][A-Za-z0-9_]*)[^\\n]*\\n?", "", release_body)
          assignment = 'signingConfig = signingConfigs.getByName("release")' if kotlin else 'signingConfig signingConfigs.release'
          source = source[:release_open + 1] + release_body.rstrip() + "\\n                " + assignment + "\\n            " + source[release_close:]
          if "signingConfigs.getByName(\\"release\\")" not in source and "signingConfig signingConfigs.release" not in source:
              raise SystemExit("Release build is not attached to the upload signing config.")

          p.write_text(source)
          print("Verified release signing config exists and is attached to release build type.")
          PY

      - name: Get dependencies
        working-directory: astro_mobile
        run: flutter pub get

      - name: Clean project
        working-directory: astro_mobile
        run: flutter clean

      - name: Get dependencies again
        working-directory: astro_mobile
        run: flutter pub get

      - name: Generate ASTRO MOBILE launcher icon
        working-directory: astro_mobile
        run: dart run flutter_launcher_icons

      - name: Build signed Play AAB
        working-directory: astro_mobile
        run: flutter build appbundle --release

      - name: Verify signed Play AAB
        run: |
          set -e
          AAB=astro_mobile/build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify "$AAB"
          KEYSTORE_CERT=$(keytool -list -v -keystore astro_mobile/android/app/astro-upload-key.jks -alias astro-mobile-upload -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          AAB_CERT=$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          test -n "$KEYSTORE_CERT"
          test -n "$AAB_CERT"
          if [ "$KEYSTORE_CERT" != "$AAB_CERT" ]; then
            echo "AAB signing certificate does not match the configured Google Play upload keystore."
            echo "Expected: $KEYSTORE_CERT"
            echo "Actual:   $AAB_CERT"
            exit 1
          fi
          echo "AAB signature matches the configured Google Play upload keystore."

      - name: Upload Play AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRO-MOBILE-GOOGLE-PLAY-AAB
          path: astro_mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
